name: Publish OpenCode plugin

# The ArchDev CLI release creates the v<version> tag on main. This publishes
# the generated plugins/opencode package as @archastro/archdev-opencode at the
# same version. Tags named archdev-old-v<version> (the TypeScript CLI) do not
# match.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-opencode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a release commit from main and a tag matching the catalog
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const catalog = JSON.parse(readFileSync('catalog/archdev.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('plugins/opencode/package.json', 'utf8'));
          assert.equal(pkg.name, '@archastro/archdev-opencode');
          assert.equal(pkg.version, catalog.version, 'plugins/opencode is out of date with the catalog');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          if (process.env.DRY_RUN !== 'true' || process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Publishing requires a tag matching catalog/archdev.json');
          }
          JS

  test:
    needs: validate
    uses: ./.github/workflows/plugins.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with OIDC support
        run: npm install --global npm@11.19.0
      - name: Use an unpublished version for dry-run registry checks
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          preview_version="$(node -p 'require("./package.json").version.split("-")[0] + "-dryrun." + process.env.GITHUB_RUN_ID + "." + process.env.GITHUB_RUN_ATTEMPT')"
          npm version "$preview_version" --no-git-tag-version --ignore-scripts
      - name: Pack
        run: |
          npm pack --json > "$RUNNER_TEMP/package-result.json"
          node -e 'const p=require(process.env.RUNNER_TEMP+"/package-result.json")[0];console.log("PACKAGE_ARCHIVE="+process.cwd()+"/"+p.filename)' >> "$GITHUB_ENV"
          node -e 'const p=require("./package.json");console.log("DIST_TAG="+(p.version.includes("-")?"next":"latest"))' >> "$GITHUB_ENV"
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish "$PACKAGE_ARCHIVE" --dry-run --ignore-scripts --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
      # npm exchanges the GitHub OIDC identity for a short-lived credential.
      # Configure this exact workflow filename using `npm trust github`.
      - name: Publish with trusted publishing and provenance
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish "$PACKAGE_ARCHIVE" --ignore-scripts --access public --provenance --tag "$DIST_TAG" --registry=https://registry.npmjs.org
