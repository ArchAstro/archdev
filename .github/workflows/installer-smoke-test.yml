name: Installer Smoke Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unix-installer:
    name: Unix Installer (${{ matrix.os }}, ${{ matrix.shell_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_name: bash
            completion_file: .local/share/bash-completion/completions/archdev
          - os: macos-latest
            shell_name: zsh
            completion_file: .zsh/completions/_archdev
          - os: ubuntu-latest
            shell_name: fish
            completion_file: .config/fish/completions/archdev.fish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cloud installer process contracts
        if: matrix.shell_name == 'bash'
        run: python3 scripts/test-cloud-installer.py
      - name: Sign-in and setup prompts in a terminal
        if: matrix.shell_name != 'fish'
        run: python3 scripts/test-installer-prompts.py -v
      - name: Build fixture release
        run: |
          chmod +x install.sh scripts/create-unix-fixtures.sh
          scripts/create-unix-fixtures.sh --output-dir "$RUNNER_TEMP/release" --version 0.31.0
      - name: Start fixture server
        run: |
          cd "$RUNNER_TEMP/release"
          python3 -m http.server 8123 --bind 127.0.0.1 >"$RUNNER_TEMP/server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/server.pid"
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8123/SHA256SUMS >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Install CLI-only release
        env:
          ARCHDEV_RELEASE_BASE_URL: http://127.0.0.1:8123
          ARCHDEV_VERSION: 0.31.0
          HOME: ${{ runner.temp }}/home
          SHELL: /bin/${{ matrix.shell_name }}
          ARCHDEV_INSTALL_DIR: ${{ runner.temp }}/home/.local/bin
        run: |
          mkdir -p "$HOME"
          ./install.sh
          test "$("$HOME/.local/bin/archdev" --version)" = 0.31.0
          test -f "$HOME/${{ matrix.completion_file }}"
      - name: Install a release without a completion command
        env:
          HOME: ${{ runner.temp }}/home-nocompletion
          SHELL: /bin/${{ matrix.shell_name }}
        run: |
          # The Rust archdev has no `completion` command. The installer must
          # still succeed and must not leave an empty completion file.
          mkdir -p "$HOME"
          scripts/create-unix-fixtures.sh --output-dir "$RUNNER_TEMP/release-nocompletion" --version 0.31.0 --no-completion
          ./install.sh --version 0.31.0 --base-url "file://$RUNNER_TEMP/release-nocompletion" --install-dir "$HOME/.local/bin"
          test "$("$HOME/.local/bin/archdev" --version)" = 0.31.0
          test ! -e "$HOME/${{ matrix.completion_file }}"
      - name: Setup installs globally without a terminal
        env:
          ARCHDEV_RELEASE_BASE_URL: http://127.0.0.1:8123
          ARCHDEV_VERSION: 0.31.0
          HOME: ${{ runner.temp }}/home-setup
          SHELL: /bin/${{ matrix.shell_name }}
          ARCHDEV_INSTALL_DIR: ${{ runner.temp }}/home-setup/.local/bin
        run: |
          # The documented one-liner: the script arrives on stdin and there is
          # no terminal, so the installer must not prompt. The checkout is a
          # Git repository, and the unasked placement question means global.
          mkdir -p "$HOME"
          cat install.sh | bash >"$RUNNER_TEMP/unattended.log" 2>&1
          grep -F 'Skill and hooks installed for this user' "$RUNNER_TEMP/unattended.log"
          grep -F 'Set up this repository with ArchDev.' "$RUNNER_TEMP/unattended.log"
          cat install.sh | bash -s -- --scope repository >"$RUNNER_TEMP/repository.log" 2>&1
          grep -F 'Skill and hooks installed for' "$RUNNER_TEMP/repository.log"
          if grep -F 'for this user' "$RUNNER_TEMP/repository.log"; then exit 1; fi
          # Older documented commands still pass --reporting. Reporting is
          # always on, so `disabled` declines setup instead of being ignored.
          cat install.sh | bash -s -- --scope user --reporting enabled >"$RUNNER_TEMP/legacy.log" 2>&1
          grep -F 'Skill and hooks installed for this user' "$RUNNER_TEMP/legacy.log"
          cat install.sh | bash -s -- --scope user --reporting disabled >"$RUNNER_TEMP/declined.log" 2>&1
          grep -F 'declines setup' "$RUNNER_TEMP/declined.log"
          if grep -F 'Skill and hooks installed' "$RUNNER_TEMP/declined.log"; then exit 1; fi
          # A script cut off mid-transfer must not run any of it.
          if head -c 20000 install.sh | bash >"$RUNNER_TEMP/truncated.log" 2>/dev/null; then exit 1; fi
          test ! -s "$RUNNER_TEMP/truncated.log"
      - name: Stop fixture server
        if: always()
        run: test ! -f "$RUNNER_TEMP/server.pid" || kill "$(cat "$RUNNER_TEMP/server.pid")" || true

  # The jobs above install fixture binaries. This one installs the published
  # release on each distribution and runs it, which is the only way to catch
  # a build that does not start there (ubuntu:20.04 has glibc 2.31, older
  # than the glibc build needs, so x64 must fall back to the musl build).
  linux-release:
    name: Linux release install (${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: "ubuntu:20.04", musl_fallback: "1" }
          - { runner: ubuntu-latest, image: "ubuntu:24.04" }
          - { runner: ubuntu-latest, image: "debian:12-slim" }
          - { runner: ubuntu-latest, image: "fedora:41" }
          - { runner: ubuntu-latest, image: "alpine:3.20" }
          - { runner: ubuntu-24.04-arm, image: "ubuntu:24.04" }
          - { runner: ubuntu-24.04-arm, image: "ubuntu:20.04", glibc_floor: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run the latest release
        run: |
          docker run --rm -e EXPECT_GLIBC_FLOOR="${{ matrix.glibc_floor }}" \
            -e EXPECT_MUSL_FALLBACK="${{ matrix.musl_fallback }}" \
            -v "$PWD:/src:ro" "${{ matrix.image }}" sh /src/scripts/test-linux-release-install.sh

  # The published release on both Mac architectures, through the documented
  # one-liner shape. Sign-in is skipped: CI has no account to sign in with.
  macos-release:
    name: macOS release install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run the latest release
        env:
          HOME: ${{ runner.temp }}/home
          SHELL: /bin/zsh
        run: |
          mkdir -p "$HOME"
          cat install.sh | bash -s -- --skip-login >"$RUNNER_TEMP/out.log" 2>&1 || { cat "$RUNNER_TEMP/out.log"; exit 1; }
          cat "$RUNNER_TEMP/out.log"
          # The installer picks /usr/local/bin when it is writable, else ~/.local/bin.
          bin="$(PATH="$HOME/.local/bin:/usr/local/bin:$PATH" command -v archdev)"
          version="$("$bin" --version)"
          echo "$bin $version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # The binary matches the CPU, not a Rosetta guess.
          case "$(uname -m)" in
            arm64) file "$bin" | grep -q arm64 ;;
            x86_64) file "$bin" | grep -q x86_64 ;;
          esac
          codesign --verify --strict "$bin"
          # A new zsh finds it, and a second run changes nothing.
          zsh -ic 'command -v archdev'
          cat install.sh | bash -s -- --skip-login >"$RUNNER_TEMP/again.log" 2>&1 || { cat "$RUNNER_TEMP/again.log"; exit 1; }
          grep -q "already installed" "$RUNNER_TEMP/again.log"

  # Windows installs the TypeScript CLI (archdev-old) until the Rust Windows
  # build ships; this installs the published zip and runs it.
  windows-release:
    name: Windows release install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run the latest release
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "archdev-bin"
          ./install.ps1 -InstallDir $dir -SkipLogin -SkipSetup
          $version = (& (Join-Path $dir "archdev.exe") --version | Out-String).Trim()
          Write-Host "installed $version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version output: $version" }
          # New shells find it through the user PATH the installer updated.
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User") -split ';'
          if ($userPath -notcontains $dir) { throw "$dir was not added to the user PATH" }

  windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fixture release
        shell: pwsh
        run: ./scripts/create-windows-fixtures.ps1 -OutputDir "$env:RUNNER_TEMP\release" -Version 0.31.0
      - name: Install CLI-only release
        shell: pwsh
        run: |
          $serverLog = Join-Path $env:RUNNER_TEMP "server.log"
          $serverError = Join-Path $env:RUNNER_TEMP "server-error.log"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8123", "--bind", "127.0.0.1" -WorkingDirectory (Join-Path $env:RUNNER_TEMP "release") -RedirectStandardOutput $serverLog -RedirectStandardError $serverError -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if ($server.HasExited) { throw "Fixture server exited before becoming ready" }
              try {
                Invoke-WebRequest http://127.0.0.1:8123/SHA256SUMS -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "Fixture server did not become ready" }
            # The installer must resolve archdev-old, never the Rust latest release.
            $plan = (./install.ps1 -Version 0.31.0 -DryRun) -join "`n"
            if ($plan -notmatch "asset_url=https://github.com/ArchAstro/archdev/releases/download/archdev-old-v0.31.0/archdev-old-windows-(x64|arm64).zip") { throw "Unexpected pinned asset URL: $plan" }
            $latest = (./install.ps1 -DryRun) -join "`n"
            if ($latest -match "releases/latest/download/archdev-old-") { throw "latest resolved to an archdev-old asset without a tag: $latest" }
            if ($latest -notmatch "asset_url=https://github.com/ArchAstro/archdev/releases/(download/archdev-old-v\d+\.\d+\.\d+/archdev-old-windows|latest/download/archdev-windows)-(x64|arm64).zip") { throw "Unexpected latest asset URL: $latest" }
            ./install.ps1 -Version 0.31.0 -BaseUrl http://127.0.0.1:8123 -InstallDir "$env:RUNNER_TEMP\bin" -SkipPathUpdate
            $cliVersion = & "$env:RUNNER_TEMP\bin\archdev.exe" --version
            if ($cliVersion.Trim() -ne "0.31.0") { throw "archdev.exe version mismatch" }
            # No terminal in CI, so the installer must not prompt. The checkout
            # is a Git repository, and the unasked placement question means global.
            $unattended = (./install.ps1 -Version 0.31.0 -BaseUrl http://127.0.0.1:8123 -InstallDir "$env:RUNNER_TEMP\bin" -SkipPathUpdate *>&1 | Out-String)
            if ($unattended -notmatch "Skill and hooks installed for this user") { throw "Setup did not install globally: $unattended" }
            if ($unattended -notmatch "Set up this repository with ArchDev\.") { throw "Missing the agent prompt: $unattended" }
            $repository = (./install.ps1 -Version 0.31.0 -BaseUrl http://127.0.0.1:8123 -InstallDir "$env:RUNNER_TEMP\bin" -SkipPathUpdate -Scope repository *>&1 | Out-String)
            if ($repository -notmatch "Skill and hooks installed for " -or $repository -match "for this user") { throw "Setup did not install for the repository: $repository" }
            $declined = (./install.ps1 -Version 0.31.0 -BaseUrl http://127.0.0.1:8123 -InstallDir "$env:RUNNER_TEMP\bin" -SkipPathUpdate -Reporting disabled *>&1 | Out-String)
            if ($declined -notmatch "declines setup" -or $declined -match "Skill and hooks installed") { throw "-Reporting disabled did not decline setup: $declined" }
            $skipped = (./install.ps1 -Version 0.31.0 -BaseUrl http://127.0.0.1:8123 -InstallDir "$env:RUNNER_TEMP\bin" -SkipPathUpdate -SkipSetup *>&1 | Out-String)
            if ($skipped -match "Skill and hooks installed") { throw "-SkipSetup still ran setup: $skipped" }
          } catch {
            Get-Content $serverLog, $serverError -ErrorAction SilentlyContinue
            throw
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
